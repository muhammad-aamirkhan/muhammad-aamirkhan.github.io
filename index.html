
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Muhammad Aamir Khan — Personal website and professional portfolio.">

  <title>Muhammad Aamir Khan | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101820;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 42px;
      border: 2px solid #ffbf00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffbf00;
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(36px, 7vw, 54px);
      margin-bottom: 16px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: #aebbc5;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 42px;
    }

    .progress {
      width: 100%;
      height: 5px;
      background: #34414b;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 35%;
      background: #ffbf00;
      border-radius: 20px;
      animation: loading 2.5s ease-in-out infinite alternate;
    }

    @keyframes loading {
      from { width: 15%; }
      to { width: 90%; }
    }

    .status {
      color: #ffbf00;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    footer {
      margin-top: 75px;
      color: #71808b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">M</div>

    <h1>Hang tight.</h1>

    <p class="subtitle">
      Something good is taking shape.<br>
      A new experience is on its way.
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <p class="status">WEBSITE LOADING...</p>

    <footer>
      © 2026 Muhammad Aamir Khan
    </footer>

  </main>
</body>
</html>
